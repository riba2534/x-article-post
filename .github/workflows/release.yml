name: Release

# Every push to main is verified, versioned and published as a GitHub Release.
# Version = <major>.<minor> from package.json + commit count on main as the patch number.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 验证并发布
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: 计算版本号
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          patch=$(git rev-list --count HEAD)
          version="$base.$patch"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 构建扩展与 xap
        env:
          XAP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build
          npm run check:sw
          npm run build:bridge
          node dist-bridge/xap.mjs --help >/dev/null
          node scripts/package.mjs
          mkdir -p release
          cp dist-bridge/xap.mjs release/xap.mjs
          (cd skills && zip -qr ../release/markdown-to-x-article-skill.zip markdown-to-x-article)
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: 生成发布说明
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## 安装"
            echo
            echo "1. 下载 \`markdown-to-x-article-v$VERSION.zip\` 并解压。"
            echo "2. 打开 \`chrome://extensions\`，开启「开发者模式」，点「加载已解压的扩展程序」，选择解压后的目录。"
            echo "3. Agent 用户另外下载 \`xap.mjs\`（Node ≥ 22），运行 \`node xap.mjs serve\`，详见 README。"
            echo
            echo "## 变更"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s (%h)' "$prev..HEAD"
            else
              git log --no-merges --pretty='- %s (%h)' HEAD
            fi
          } > release-notes.md
          cat release-notes.md
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md
